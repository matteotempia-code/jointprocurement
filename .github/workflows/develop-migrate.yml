name: Apply Supabase DEV migrations

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY_DEV_MIGRATIONS
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate-dev:
    name: Prisma migrate deploy to Supabase DEV
    if: ${{ inputs.confirmation == 'APPLY_DEV_MIGRATIONS' }}
    runs-on: ubuntu-latest
    environment: develop
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
      DEPLOYMENT_ENVIRONMENT: develop
      NODE_ENV: development
    steps:
      - name: Check out requested develop commit
        uses: actions/checkout@v7
        with:
          ref: develop

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Guard DEV target
        shell: bash
        run: |
          test "$DEPLOYMENT_ENVIRONMENT" = "develop"
          test -n "$DATABASE_URL"
          test "${{ github.ref_name }}" = "develop"

      - name: Install dependencies
        run: npm ci

      - name: Validate migrations
        run: npx prisma validate

      - name: Apply pending DEV migrations
        run: npx prisma migrate deploy

      - name: Verify DEV migration status
        run: npx prisma migrate status
