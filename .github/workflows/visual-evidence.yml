name: Visual evidence

# Fotografa il deployment vero e conserva le schermate come artefatto.
#
# Perche esiste: il canone di interfaccia (docs/design/CANONE.md) ha criteri che si
# verificano solo guardando, e le cinque certificazioni remote scattano le schermate
# ma le scrivono soltanto quando qualcosa fallisce. Senza queste prove l'unico modo
# di vedere una pagina e avere le credenziali locali o il segreto di bypass di Vercel.
#
# tests/browser-qa.mjs esisteva gia e fa il giro giusto: accetta QA_BASE_URL, cammina
# sulle pagine e le scrive in cinque cartelle. Qui gli si da un ambiente in cui girare.
#
# Gira in parallelo alle certificazioni, quindi non allunga la pipeline: aspetta solo
# che il deployment sia pronto. Non e un workflow_dispatch perche il branch predefinito
# del repository, master, non contiene .github/workflows.

on:
  workflow_call:
    inputs:
      deployment_url:
        required: true
        type: string

permissions:
  contents: read

jobs:
  capture:
    name: Cattura le schermate
    runs-on: ubuntu-latest
    environment: develop
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
      NODE_ENV: test
      DEMO_MODE: "true"
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.DEV_VERCEL_AUTOMATION_BYPASS_SECRET }}
      VERCEL_TARGET: develop
      QA_BASE_URL: ${{ inputs.deployment_url }}
    steps:
      - name: Check out develop commit
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Il checkout porta con se' le schermate vecchie gia versionate in artifacts/.
      # Se la passata fallisce prima di scattarne una, il caricamento le raccoglie e
      # sembrano prove nuove: e' successo davvero. Si cancellano prima, cosi' quello
      # che viene caricato o e' fresco o non c'e'.
      - name: Clear the stale screenshots before capturing
        run: |
          rm -rf artifacts/final-mvp-review artifacts/style-audit artifacts/ux-final-review \
                 artifacts/smart-import-review artifacts/smart-import-ux-final

      - name: Walk the pages and capture them
        run: npm run qa:browser

      # Sempre: una passata che si interrompe a meta lascia comunque le pagine gia
      # fotografate, e quelle servono lo stesso.
      - name: Upload the screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-evidence-${{ github.sha }}
          # Solo le cinque cartelle che tests/browser-qa.mjs scrive. Non "artifacts/"
          # intero, che contiene anche 28 MB di schermate vecchie gia versionate.
          path: |
            artifacts/final-mvp-review/
            artifacts/style-audit/
            artifacts/ux-final-review/
            artifacts/smart-import-review/
            artifacts/smart-import-ux-final/
          if-no-files-found: error
          retention-days: 14
