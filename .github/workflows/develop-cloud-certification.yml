name: Develop Cloud Certification

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: develop-cloud-certification
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality-and-db:
    name: Quality and Supabase DEV
    runs-on: ubuntu-latest
    environment: develop
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
      DEMO_MODE: "true"
      DOCUMENT_STORAGE_PROVIDER: "local"
      PROCUREMENT_AI_ENABLED: "false"
    steps:
      - name: Check out develop commit
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify DEV database configuration
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DEV_DATABASE_URL is not configured in the GitHub develop environment."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run unit and Supabase DEV integration tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD

  remote-smoke:
    name: Vercel develop remote smoke
    needs: quality-and-db
    runs-on: ubuntu-latest
    environment: develop
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.DEV_VERCEL_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.DEV_VERCEL_AUTOMATION_BYPASS_SECRET }}
      VERCEL_PROJECT_ID: ${{ vars.DEV_VERCEL_PROJECT_ID }}
      VERCEL_TEAM_ID: ${{ vars.DEV_VERCEL_TEAM_ID }}
      VERCEL_TARGET: develop
    steps:
      - name: Check out develop commit
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Vercel DEV configuration
        shell: bash
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_AUTOMATION_BYPASS_SECRET VERCEL_PROJECT_ID VERCEL_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "$name is not configured in the GitHub develop environment."
              missing=1
            fi
          done
          exit "$missing"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for the matching Vercel develop deployment
        id: deployment
        env:
          EXPECTED_GIT_SHA: ${{ github.sha }}
        run: node scripts/qa/wait-for-vercel-develop.mjs

      - name: Run remote critical smoke
        env:
          QA_BASE_URL: ${{ steps.deployment.outputs.url }}
        run: npm run qa:develop:remote
