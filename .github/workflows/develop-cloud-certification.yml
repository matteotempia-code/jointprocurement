name: Develop Cloud Certification

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      apply_dev_migrations:
        description: Apply pending Prisma migrations to Supabase DEV before certification
        required: false
        default: false
        type: boolean

concurrency:
  group: develop-cloud-certification
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality-and-db:
    name: Quality and Supabase DEV
    runs-on: ubuntu-latest
    environment: develop
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
      EXPECTED_DEV_DATABASE_REF: kvrvprzojwqhqtqsxkgu
      DEMO_MODE: "true"
      DOCUMENT_STORAGE_PROVIDER: "local"
      PROCUREMENT_AI_ENABLED: "false"
    steps:
      - name: Check out develop commit
        uses: actions/checkout@v7
        with:
          # The whitespace gate compares the current commit with its parent.
          # Two commits also cover workflow_dispatch while the root-commit
          # fallback below keeps a newly-created repository valid.
          fetch-depth: 2

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Derive Supabase DEV migration connection
        run: node scripts/qa/derive-dev-direct-url.mjs

      - name: Verify DEV database configuration
        run: node scripts/qa/validate-dev-database-config.mjs

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply pending Supabase DEV migrations
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply_dev_migrations) }}
        run: npx prisma migrate deploy

      - name: Verify Supabase DEV migration status
        run: npx prisma migrate status

      - name: Inspect Supabase DEV state
        run: npm run qa:dev:state

      - name: Remove orphaned certification fixtures
        env:
          ALLOW_CERTIFICATION_CLEANUP: "true"
        run: npm run qa:certification:cleanup

      - name: Run unit and Supabase DEV integration tests
        run: npm run qa:test:ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check patch whitespace
        shell: bash
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff-tree --check --root --no-commit-id -r HEAD
          fi

  prepare-deployment:
    name: Prepare Vercel develop deployment
    needs: quality-and-db
    runs-on: ubuntu-latest
    environment: develop
    timeout-minutes: 15
    outputs:
      deployment_url: ${{ steps.deployment.outputs.url }}
    env:
      DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
      NODE_ENV: test
      DEMO_MODE: "true"
      VERCEL_TOKEN: ${{ secrets.DEV_VERCEL_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.DEV_VERCEL_AUTOMATION_BYPASS_SECRET }}
      VERCEL_PROJECT_ID: ${{ vars.DEV_VERCEL_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ vars.DEV_VERCEL_TEAM_ID }}
      VERCEL_TEAM_ID: ${{ vars.DEV_VERCEL_TEAM_ID }}
      VERCEL_TARGET: develop
      EXPECTED_DEV_DATABASE_REF: kvrvprzojwqhqtqsxkgu
      EXPECTED_DEV_LATEST_MIGRATION: 20260922170000_global_document_sequences
    steps:
      - name: Check out develop commit
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify Vercel DEV configuration
        shell: bash
        run: |
          missing=0
          for name in DATABASE_URL VERCEL_TOKEN VERCEL_AUTOMATION_BYPASS_SECRET VERCEL_PROJECT_ID VERCEL_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "$name is not configured in the GitHub develop environment."
              missing=1
            fi
          done
          exit "$missing"

      - name: Install dependencies
        run: npm ci

      - name: Derive Supabase DEV migration connection
        run: node scripts/qa/derive-dev-direct-url.mjs

      - name: Verify canonical DEV database configuration
        run: node scripts/qa/validate-dev-database-config.mjs

      - name: Synchronize canonical database secrets to Vercel develop
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$DATABASE_URL" | npx --yes vercel@59.1.4 env add DATABASE_URL "$VERCEL_TARGET" --force --sensitive --yes --token="$VERCEL_TOKEN"
          printf '%s' "$DIRECT_URL" | npx --yes vercel@59.1.4 env add DIRECT_URL "$VERCEL_TARGET" --force --sensitive --yes --token="$VERCEL_TOKEN"

      - name: Deploy synchronized commit to Vercel develop
        id: deployment
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(npx --yes vercel@59.1.4 deploy --target="$VERCEL_TARGET" --yes --token="$VERCEL_TOKEN" --meta githubCommitSha="$GITHUB_SHA")"
          if [[ ! "$deployment_url" =~ ^https:// ]]; then
            echo "Vercel deploy did not return a deployment URL."
            exit 1
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify deployed database identity and migrations
        env:
          QA_BASE_URL: ${{ steps.deployment.outputs.url }}
        run: node scripts/qa/assert-remote-database-health.mjs


  lifecycle:
    name: Remote lifecycle and personas
    needs: prepare-deployment
    uses: ./.github/workflows/remote-certification.yml
    with:
      certification_name: lifecycle
      command: npm run qa:demo:remote
      deployment_url: ${{ needs.prepare-deployment.outputs.deployment_url }}
      timeout_minutes: 15
    secrets: inherit

  external-demo:
    name: Remote external-demo hardening
    needs: prepare-deployment
    uses: ./.github/workflows/remote-certification.yml
    with:
      certification_name: external-demo
      command: npm run qa:demo:external
      deployment_url: ${{ needs.prepare-deployment.outputs.deployment_url }}
      timeout_minutes: 10
    secrets: inherit

  procurement-ai:
    name: Remote Procurement AI
    needs: prepare-deployment
    uses: ./.github/workflows/remote-certification.yml
    with:
      certification_name: procurement-ai
      command: npm run qa:procurement-ai:remote
      deployment_url: ${{ needs.prepare-deployment.outputs.deployment_url }}
      timeout_minutes: 10
    secrets: inherit

  m12-product-intelligence:
    name: Remote M12 Product Intelligence
    needs: prepare-deployment
    uses: ./.github/workflows/remote-certification.yml
    with:
      certification_name: m12-product-intelligence
      command: npm run qa:m12:remote
      deployment_url: ${{ needs.prepare-deployment.outputs.deployment_url }}
      timeout_minutes: 15
    secrets: inherit

  smart-import:
    name: Remote Smart Import
    needs: prepare-deployment
    uses: ./.github/workflows/remote-certification.yml
    with:
      certification_name: smart-import
      command: npm run qa:smart-import:remote
      deployment_url: ${{ needs.prepare-deployment.outputs.deployment_url }}
      timeout_minutes: 15
    secrets: inherit

  critical-smoke:
    name: Remote critical smoke
    needs: prepare-deployment
    uses: ./.github/workflows/remote-certification.yml
    with:
      certification_name: critical-smoke
      command: npm run qa:develop:remote
      deployment_url: ${{ needs.prepare-deployment.outputs.deployment_url }}
      timeout_minutes: 10
    secrets: inherit
